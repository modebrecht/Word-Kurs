name: Build Word course

on:
  push:
    branches: [main, 2nd-rnd-qa]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/build-word-course.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/generate_course.py
      - name: Validate generated package
        run: python src/validate_build.py
      - name: Upload A7 A9 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7-a9-qa
          path: |
            arbeitsblaetter/A7_Bilder_in_Word.docx
            arbeitsblaetter/A9_Formatvorlagen_und_Ueberschriften.docx
            arbeitsblaetter/assets/vorlagen/a7_bildwerkzeuge.png
            arbeitsblaetter/assets/vorlagen/a9_formatvorlagen_werkzeuge.png
      - name: Commit generated Word package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arbeitsblaetter
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build complete Word course package"
            git push
          fi
