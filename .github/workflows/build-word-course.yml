name: Build Word course

on:
  push:
    branches: [main, 3rd-round-qa]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/build-word-course.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/generate_course.py
      - name: Validate generated package
        run: python src/validate_build.py
      - name: Render V3 DOCX pages for review
        if: github.ref_name == '3rd-round-qa'
        run: |
          if ! command -v libreoffice >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi
          python src/render_v3_qa.py
      - name: Commit generated Word package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arbeitsblaetter
          if [ "\${{ github.ref_name }}" = "3rd-round-qa" ]; then git add qa/3rd-round; fi
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build complete Word course package"
            git push
          fi
